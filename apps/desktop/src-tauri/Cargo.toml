[package]
name = "funbutton"
version = "0.1.7"
description = "FunButton.ai — local-first voice dictation"
authors = ["Todd Dickerson <todd@clickfunnels.com>"]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/todddickerson/funbutton"

[lib]
name = "funbutton_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "=2.6.1", features = [] }

[dependencies]
tauri = { version = "=2.11.1", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-opener = "=2.5.4"
tauri-plugin-store = "=2.4.3"
tauri-plugin-shell = "=2.3.5"
tauri-plugin-clipboard-manager = "=2.3.2"
tauri-plugin-autostart = "=2.5.1"
tauri-plugin-global-shortcut = "=2.3.1"
tauri-plugin-notification = "=2.3.3"
tauri-plugin-macos-permissions = "=2.3.0"
tauri-plugin-deep-link = "=2.4.9"

# local-only history archive
rusqlite = { version = "=0.39.0", features = ["bundled"] }

# on-device STT: whisper GGUF via transcribe-cpp (whisper.cpp/ggml wrapper;
# metal feature added in the macOS target table below)
transcribe-cpp = { version = "=0.1.3", default-features = false }
# capture-rate → 16 kHz resampling for whisper input
rubato = "=0.16.2"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "=0.25.0"
core-foundation = "=0.10.1"
# native frontmost-app lookup (NSWorkspace.frontmostApplication) — replaces
# the osascript shell-out on the dictation hot path; already in the tree via
# Tauri, so this pin adds no new crates
# `libc` feature exposes NSRunningApplication.processIdentifier (pid_t) — the
# pid keys the deep-context AX reads; libc is already in the tree (cpal, etc.)
objc2-app-kit = { version = "=0.3.2", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "libc"] }
# Groq API key at rest in the login Keychain (Security framework underneath)
keyring = { version = "=3.6.3", features = ["apple-native"] }
# static CPU+Metal ggml backend compiled into the binary — no shipped dylibs
transcribe-cpp = { version = "=0.1.3", default-features = false, features = ["metal"] }

serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.135"

# audio capture
cpal = "=0.17.3"
hound = "=3.5.1"

# HTTP for Groq + Ollama
reqwest = { version = "=0.13.3", default-features = false, features = ["json", "multipart", "rustls", "http2", "charset"] }
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }

# clipboard + paste injection
arboard = "=3.6.1"
enigo = "=0.6.1"

# model download integrity: pinned SHA-256 verification of every gguf
sha2 = "=0.10.9"
hex = "=0.4.3"

# misc
once_cell = "=1.21.3"
parking_lot = "=0.12.4"
anyhow = "=1.0.99"
log = "=0.4.29"
env_logger = "=0.11.8"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
# unwind (default), NOT abort: embedded_stt catches panics at the ggml
# boundary so a bad inference degrades to the fallback chain instead of
# killing the app.
